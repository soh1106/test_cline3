<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>転がる石灯籠</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
        }
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
            width: 250px;
        }
        #controls button {
            margin: 5px;
            padding: 5px 10px;
            background: #4a90e2;
            border: none;
            border-radius: 3px;
            color: white;
            cursor: pointer;
        }
        #controls button:hover {
            background: #357ae8;
        }
        #controls input {
            margin: 5px 0;
        }
        .control-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 3px;
        }
        .slider-container {
            margin-top: 10px;
        }
        .slider-container label {
            display: flex;
            justify-content: space-between;
        }
        .slider-container label span {
            font-size: 12px;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="info">転がる石灯籠 - ドラッグ: 回転 | スクロール: ズーム</div>
    <div id="debug" style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; font-size: 12px; border-radius: 4px; font-family: monospace;">
        <div>灯籠の高さ: <span id="lanternHeight">計算中...</span></div>
        <div>道路表面Y: <span id="roadSurfaceY">計算中...</span></div>
        <div>実際の坂表面Y: <span id="actualSlopeY">計算中...</span></div>
        <div>灯籠位置Y: <span id="lanternY">計算中...</span></div>
        <div>高度制限: <span id="heightLimit">計算中...</span></div>
        <div>道路からの距離: <span id="distanceFromRoad">計算中...</span></div>
    </div>
    <div id="controls">
        <div class="control-group">
            <h3 style="margin-top: 0;">転がる石灯籠</h3>
        </div>
        <hr>
        <div class="control-group">
            <button id="resetSimulation">シミュレーションリセット</button>
        </div>
        <div class="control-group slider-container">
            <label for="slopeAngle">坂の角度: <span id="slopeAngleValue">20°</span></label>
            <input type="range" id="slopeAngle" min="5" max="45" value="20" step="1">
        </div>
        <div class="control-group">
            <label for="friction">摩擦係数: <span id="frictionValue">0.1</span></label>
            <input type="range" id="friction" min="0" max="1" value="0.1" step="0.05">
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="showRoadSurface" checked> 道路面を表示
            </label>
        </div>
        <div class="control-group">
            <button id="resetCamera">カメラリセット</button>
        </div>
    </div>
    <div id="loading">モデルを読み込み中...</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // 物理世界の設定
        let world;
        let groundBody;
        let slopeBody;
        let slopeMesh;
        let timeStep = 1/120; // より小さなタイムステップで安定性を向上
        let isSimulationRunning = true;
        
        // 複数の灯籠を管理する配列
        const lanterns = [];
        const lanternCount = 1; // 灯籠の数
        
        // シーン、カメラ、レンダラーの設定
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 空色の背景
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // OrbitControlsを追加
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 環境光と指向性ライトを追加
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        scene.add(directionalLight);
        
        // XYZ軸を表示するヘルパーを追加
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // 地面プレーンを削除（ユーザーリクエストにより）
        // const groundGeometry = new THREE.PlaneGeometry(100, 100);
        // const groundMaterial = new THREE.MeshStandardMaterial({
        //     color: 0x8B7355, // より自然な土色
        //     roughness: 0.9,
        //     metalness: 0.1
        // });
        // const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
        // groundMesh.rotation.x = -Math.PI / 2;
        // groundMesh.position.y = -2;
        // groundMesh.receiveShadow = true;
        // scene.add(groundMesh);
        
        // 物理世界を初期化
        function initPhysics() {
            // 物理世界を作成
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0); // 重力を設定
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 15; // より多くの反復で安定性を向上
            world.solver.tolerance = 0.001; // より厳密な許容値
            
            // 地面の物理ボディを削除（ユーザーリクエストにより）
            // const groundShape = new CANNON.Plane();
            // groundBody = new CANNON.Body({
            //     mass: 0, // 質量0で固定
            //     position: new CANNON.Vec3(0, -2, 0),
            //     shape: groundShape
            // });
            // groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2); // 地面を水平にする
            // world.addBody(groundBody);
            
            // 坂の物理ボディを作成
            loadSlopeModel();
        }
        
        // 坂用のGLBモデルを読み込む関数
        function loadSlopeModel() {
            const slopeModelPath = '_model/miura_slope.glb';
            
            console.log('坂モデルの読み込みを試行:', slopeModelPath);
            
            // DRACOローダーの設定
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
            
            // GLTFローダーの設定
            const loader = new THREE.GLTFLoader();
            loader.setDRACOLoader(dracoLoader);
            
            loader.load(
                slopeModelPath,
                function(gltf) {
                    console.log('坂モデルを正常に読み込みました');
                    slopeModel = gltf.scene;
                    
                    // モデルのスケールを調整（必要に応じて）
                    slopeModel.scale.set(1, 1, 1);
                    
                    // 道路面メッシュを特定
                    identifyRoadSurfaces(slopeModel);
                    
                    // シャドウを有効化
                    slopeModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    createSlope();
                },
                function(xhr) {
                    console.log('坂モデル読み込み進捗:', (xhr.loaded / xhr.total * 100) + '%');
                },
                function(error) {
                    console.error('坂モデルの読み込みに失敗しました:', error);
                    console.log('デフォルトの坂を使用します');
                    createSlope();
                }
            );
        }
        
        // 坂用のGLBモデルを保存する変数
        let slopeModel = null;
        let roadPlane = null; // 道路面表示用のプレーン
        let roadSurfaceMeshes = []; // 実際の道路面メッシュを保存
        
        // レイキャスター（坂の表面高度を動的に測定するため）
        const raycaster = new THREE.Raycaster();
        
        // 道路面メッシュを特定する関数
        function identifyRoadSurfaces(model) {
            roadSurfaceMeshes = [];
            
            model.traverse(function(child) {
                if (child.isMesh) {
                    console.log(`メッシュを分析中: ${child.name || 'unnamed'}`);
                    
                    // メッシュの位置とサイズを分析
                    const meshBox = new THREE.Box3().setFromObject(child);
                    const meshSize = meshBox.getSize(new THREE.Vector3());
                    const meshCenter = meshBox.getCenter(new THREE.Vector3());
                    
                    console.log(`  サイズ: ${meshSize.x.toFixed(2)}, ${meshSize.y.toFixed(2)}, ${meshSize.z.toFixed(2)}`);
                    console.log(`  中心: ${meshCenter.x.toFixed(2)}, ${meshCenter.y.toFixed(2)}, ${meshCenter.z.toFixed(2)}`);
                    
                    // メッシュの法線ベクトルを分析して道路面を特定
                    const geometry = child.geometry;
                    if (geometry.attributes.normal) {
                        const normals = geometry.attributes.normal.array;
                        let upwardFacingCount = 0;
                        let horizontalFacingCount = 0;
                        let totalFaces = normals.length / 9; // 3頂点 × 3成分 = 9
                        
                        // 各面の法線を調べる
                        for (let i = 0; i < normals.length; i += 9) {
                            // 3つの頂点の法線の平均を計算
                            const nx = (normals[i] + normals[i+3] + normals[i+6]) / 3;
                            const ny = (normals[i+1] + normals[i+4] + normals[i+7]) / 3;
                            const nz = (normals[i+2] + normals[i+5] + normals[i+8]) / 3;
                            
                            // Y成分が大きい（上向き）面をカウント
                            if (ny > 0.3) { // 約17度以上上向きの面（条件を緩和）
                                upwardFacingCount++;
                            }
                            
                            // 水平に近い面をカウント
                            if (Math.abs(ny) > Math.abs(nx) && Math.abs(ny) > Math.abs(nz)) {
                                horizontalFacingCount++;
                            }
                        }
                        
                        const upwardRatio = upwardFacingCount / totalFaces;
                        const horizontalRatio = horizontalFacingCount / totalFaces;
                        
                        console.log(`  上向き面比率: ${(upwardRatio * 100).toFixed(1)}%`);
                        console.log(`  水平面比率: ${(horizontalRatio * 100).toFixed(1)}%`);
                        
                        // 道路面の判定条件を複数設定
                        const isRoadSurface = (
                            upwardRatio > 0.1 || // 10%以上が上向きの面
                            horizontalRatio > 0.2 || // 20%以上が水平面
                            (meshSize.x > 5 && meshSize.z > 5 && meshSize.y < meshSize.x * 0.5) // 平たい形状
                        );
                        
                        if (isRoadSurface) {
                            roadSurfaceMeshes.push(child);
                            console.log(`  → 道路面メッシュとして特定`);
                        }
                    } else {
                        // 法線情報がない場合は形状で判定
                        if (meshSize.x > 5 && meshSize.z > 5 && meshSize.y < meshSize.x * 0.3) {
                            roadSurfaceMeshes.push(child);
                            console.log(`  → 形状により道路面メッシュとして特定`);
                        }
                    }
                }
            });
            
            console.log(`特定された道路面メッシュ数: ${roadSurfaceMeshes.length}`);
        }
        
        // 坂の表面高度を取得する関数
        function getSlopeHeightAtPosition(x, z) {
            if (!slopeMesh) {
                return 0; // 坂モデルが存在しない場合はデフォルト値
            }
            
            // 上方向から下向きにレイを飛ばす
            const rayOrigin = new THREE.Vector3(x, 50, z); // 十分高い位置から
            const rayDirection = new THREE.Vector3(0, -1, 0); // 下向き
            
            raycaster.set(rayOrigin, rayDirection);
            
            // 道路面メッシュが特定されている場合はそれを優先
            if (roadSurfaceMeshes.length > 0) {
                const intersects = raycaster.intersectObjects(roadSurfaceMeshes, false);
                if (intersects.length > 0) {
                    return intersects[0].point.y;
                }
            }
            
            // 道路面メッシュで交点が見つからない場合は全体を対象
            const intersects = raycaster.intersectObject(slopeMesh, true);
            
            if (intersects.length > 0) {
                // 最初の交点（最も高い位置）のY座標を返す
                return intersects[0].point.y;
            } else {
                // 交点がない場合は坂モデルの中央高度を返す
                const slopeBox = new THREE.Box3().setFromObject(slopeMesh);
                const slopeCenter = slopeBox.getCenter(new THREE.Vector3());
                return slopeCenter.y;
            }
        }
        
        function createSlope() {
            // 既存の坂を削除
            if (slopeMesh) {
                scene.remove(slopeMesh);
            }
            if (slopeBody) {
                world.removeBody(slopeBody);
            }
            // 既存の道路面プレーンを削除
            if (roadPlane) {
                scene.remove(roadPlane);
                roadPlane = null;
            }
            
            // 坂の角度を取得
            const slopeAngle = parseFloat(document.getElementById('slopeAngle').value);
            const radians = toRadians(slopeAngle);
            
            if (slopeModel) {
                // GLBモデルを使用して坂を作成
                slopeMesh = slopeModel.clone();
                slopeMesh.castShadow = true;
                slopeMesh.receiveShadow = true;
                
                // シャドウを有効化
                slopeMesh.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                // 坂の位置と回転を設定（角度スライダーに対応）
                slopeMesh.position.set(0, 0, 0);
                slopeMesh.rotation.x = radians; // 角度スライダーの値を適用
                scene.add(slopeMesh);
                
                // 坂モデルの底面（実際の道路面）に赤いプレーンを配置
                const slopeBox = new THREE.Box3().setFromObject(slopeMesh);
                const slopeSize = slopeBox.getSize(new THREE.Vector3());
                const slopeCenter = slopeBox.getCenter(new THREE.Vector3());
                
                // 道路表面を赤く表示するプレーンを追加（チェックボックスの状態に応じて）
                const showRoadSurface = document.getElementById('showRoadSurface').checked;
                if (showRoadSurface) {
                    if (roadSurfaceMeshes.length > 0) {
                        // 特定された道路面メッシュに基づいて連続した道路面を作成
                        
                        // 全ての道路面メッシュの範囲を統合
                        let minX = Infinity, maxX = -Infinity;
                        let minZ = Infinity, maxZ = -Infinity;
                        
                        roadSurfaceMeshes.forEach(mesh => {
                            const meshBox = new THREE.Box3().setFromObject(mesh);
                            minX = Math.min(minX, meshBox.min.x);
                            maxX = Math.max(maxX, meshBox.max.x);
                            minZ = Math.min(minZ, meshBox.min.z);
                            maxZ = Math.max(maxZ, meshBox.max.z);
                        });
                        
                        const roadWidth = maxX - minX;
                        const roadLength = maxZ - minZ;
                        const roadCenterX = (minX + maxX) / 2;
                        const roadCenterZ = (minZ + maxZ) / 2;
                        
                        console.log(`統合された道路面: 幅=${roadWidth.toFixed(2)}, 長さ=${roadLength.toFixed(2)}`);
                        
                        // 連続した道路面を作成（Z軸方向に分割して高さの変化を表現）
                        const segments = 30; // より多くのセグメントで滑らかに
                        const segmentDepth = roadLength / segments;
                        
                        // 道路面の頂点を生成
                        const vertices = [];
                        const indices = [];
                        
                        for (let i = 0; i <= segments; i++) {
                            const z = minZ + (i / segments) * roadLength;
                            
                            // 真ん中あたりで高さを変化させる（正弦波を使用）
                            const normalizedPosition = (i / segments) * 2 - 1; // -1 to 1
                            const heightVariation = Math.sin(normalizedPosition * Math.PI * 2) * 0.2;
                            
                            // 実際の道路面の高度を取得
                            const actualHeight = getSlopeHeightAtPosition(roadCenterX, z);
                            const finalHeight = actualHeight + heightVariation + 0.05;
                            
                            // 道路の左端と右端の頂点を追加
                            vertices.push(minX, finalHeight, z); // 左端
                            vertices.push(maxX, finalHeight, z); // 右端
                        }
                        
                        // インデックスを生成（三角形を作成）
                        for (let i = 0; i < segments; i++) {
                            const base = i * 2;
                            
                            // 各セグメントで2つの三角形を作成
                            // 三角形1
                            indices.push(base, base + 1, base + 2);
                            // 三角形2
                            indices.push(base + 1, base + 3, base + 2);
                        }
                        
                        // ジオメトリを作成
                        const roadGeometry = new THREE.BufferGeometry();
                        roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                        roadGeometry.setIndex(indices);
                        roadGeometry.computeVertexNormals();
                        
                        const roadMaterial = new THREE.MeshBasicMaterial({
                            color: 0xff0000, // 赤色
                            transparent: true,
                            opacity: 0.4,
                            side: THREE.DoubleSide
                        });
                        
                        roadPlane = new THREE.Mesh(roadGeometry, roadMaterial);
                        scene.add(roadPlane);
                        
                    } else {
                        // フォールバック: 従来の方法で連続した道路面を作成
                        const segments = 30;
                        const segmentWidth = slopeSize.x;
                        const segmentDepth = slopeSize.z / segments;
                        
                        const vertices = [];
                        const indices = [];
                        
                        for (let i = 0; i <= segments; i++) {
                            const z = slopeCenter.z - slopeSize.z/2 + (i / segments) * slopeSize.z;
                            const normalizedPosition = (i / segments) * 2 - 1;
                            const heightVariation = Math.sin(normalizedPosition * Math.PI * 2) * 0.2;
                            const slopeBasedHeight = slopeCenter.y + ((z - slopeCenter.z) * Math.sin(radians));
                            const finalHeight = slopeBasedHeight + heightVariation;
                            
                            vertices.push(slopeCenter.x - segmentWidth/2, finalHeight, z);
                            vertices.push(slopeCenter.x + segmentWidth/2, finalHeight, z);
                        }
                        
                        for (let i = 0; i < segments; i++) {
                            const base = i * 2;
                            indices.push(base, base + 1, base + 2);
                            indices.push(base + 1, base + 3, base + 2);
                        }
                        
                        const roadGeometry = new THREE.BufferGeometry();
                        roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                        roadGeometry.setIndex(indices);
                        roadGeometry.computeVertexNormals();
                        
                        const roadMaterial = new THREE.MeshBasicMaterial({
                            color: 0xff0000,
                            transparent: true,
                            opacity: 0.3,
                            side: THREE.DoubleSide
                        });
                        
                        roadPlane = new THREE.Mesh(roadGeometry, roadMaterial);
                        scene.add(roadPlane);
                    }
                }
                
                // モデルのバウンディングボックスを取得
                const box = new THREE.Box3().setFromObject(slopeMesh);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                console.log('坂モデルのサイズ:', size);
                console.log('坂モデルの中心:', center);
                console.log('坂モデルのバウンディングボックス:', box);
                
                // シンプルな坂の物理ボディを作成（傾斜面として）
                slopeBody = new CANNON.Body({ mass: 0 });
                
                // 坂を傾斜面として近似（大きな平面）
                const slopeWidth = Math.max(size.x, 20);
                const slopeDepth = Math.max(size.z, 30);
                const slopeHeight = 0.5;
                
                const slopeShape = new CANNON.Box(new CANNON.Vec3(slopeWidth/2, slopeHeight/2, slopeDepth/2));
                slopeBody.addShape(slopeShape, new CANNON.Vec3(0, center.y, 0));
                
                slopeBody.position.set(0, 0, 0);
                
                // 坂の回転を設定
                slopeBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), radians);
            } else {
                // フォールバック：デフォルトの箱を使用
                const slopeWidth = 10;
                const slopeHeight = 0.2;
                const slopeDepth = 20;
                
                const slopeGeometry = new THREE.BoxGeometry(slopeWidth, slopeHeight, slopeDepth);
                const slopeMaterial = new THREE.MeshStandardMaterial({
                    color: 0xA0522D,
                    roughness: 0.8,
                    metalness: 0.2
                });
                slopeMesh = new THREE.Mesh(slopeGeometry, slopeMaterial);
                slopeMesh.castShadow = true;
                slopeMesh.receiveShadow = true;
                
                slopeMesh.position.set(0, 0, 0);
                slopeMesh.rotation.x = radians;
                scene.add(slopeMesh);
                
                const slopeShape = new CANNON.Box(new CANNON.Vec3(slopeWidth/2, slopeHeight/2, slopeDepth/2));
                slopeBody = new CANNON.Body({
                    mass: 0,
                    position: new CANNON.Vec3(0, 0, 0),
                    shape: slopeShape
                });
            }
            
            // 摩擦係数を設定
            const friction = parseFloat(document.getElementById('friction').value);
            slopeBody.material = new CANNON.Material();
            slopeBody.material.friction = friction;
            
            // 坂の回転を設定
            slopeBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), radians);
            world.addBody(slopeBody);
            
            // 灯籠が既に読み込まれている場合は、物理ボディを再作成
            if (lanterns.length > 0) {
                resetLanterns();
            }
        }
        
        // 灯籠オブジェクトを作成する関数
        function createLantern(model, index) {
            // モデルのサイズを取得
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const bottomY = box.min.y;
            
            // モデルの形状を近似するためのボックス形状を使用
            const boxSize = new CANNON.Vec3(
                size.x / 2,  // 幅の半分
                size.y / 2,  // 高さの半分
                size.z / 2   // 奥行きの半分
            );
            const modelShape = new CANNON.Box(boxSize);
            
            // 坂の角度を取得
            const slopeAngle = parseFloat(document.getElementById('slopeAngle').value);
            const radians = toRadians(slopeAngle);
            
            // 灯籠の初期位置を坂の上部に設定
            const xOffset = (index - Math.floor(lanternCount / 2)) * 1.5;
            const xPos = xOffset;
            const zPos = -8; // 坂のより上部に配置
            
            // 坂モデルが存在する場合は、そのバウンディングボックスを使用
            let yPos;
            if (slopeMesh) {
                // 坂モデルのバウンディングボックスを取得
                const slopeBox = new THREE.Box3().setFromObject(slopeMesh);
                const slopeSize = slopeBox.getSize(new THREE.Vector3());
                const slopeCenter = slopeBox.getCenter(new THREE.Vector3());
                
                // 坂の角度を考慮した高さ計算
                const slopeLength = slopeSize.z / 2; // 坂の半分の長さ
                const heightAtPosition = Math.abs(zPos) * Math.tan(radians); // 坂の角度による高さ
                
                // 坂の表面高度を計算
                yPos = slopeCenter.y + heightAtPosition + boxSize.y + 1.0; // 坂の表面から十分に上に配置
                
                console.log(`坂モデル情報 - サイズ: ${slopeSize.x.toFixed(2)}, ${slopeSize.y.toFixed(2)}, ${slopeSize.z.toFixed(2)}`);
                console.log(`坂モデル情報 - 中心: ${slopeCenter.x.toFixed(2)}, ${slopeCenter.y.toFixed(2)}, ${slopeCenter.z.toFixed(2)}`);
                console.log(`計算された高さ: ${heightAtPosition.toFixed(2)}, 最終Y位置: ${yPos.toFixed(2)}`);
            } else {
                // フォールバック: 理論的な坂の高さ計算
                const baseSlopeY = 0;
                const slopeHeight = baseSlopeY + Math.abs(zPos) * Math.tan(radians);
                yPos = slopeHeight + boxSize.y + 2;
            }
            
            console.log(`灯籠${index}の初期位置: x=${xPos}, y=${yPos}, z=${zPos}, 坂角度=${slopeAngle}度`);
            
            // 物理ボディを作成
            const body = new CANNON.Body({
                mass: 2, // より重い質量で安定性を向上
                position: new CANNON.Vec3(xPos, yPos, zPos),
                shape: modelShape
            });
            
            // 摩擦係数を設定
            const friction = parseFloat(document.getElementById('friction').value);
            body.material = new CANNON.Material();
            body.material.friction = friction;
            body.material.restitution = 0.1; // 反発係数を下げて跳ねを抑制
            
            // 減衰設定を強化して吹っ飛びを防ぐ
            body.linearDamping = 0.4;
            body.angularDamping = 0.3;
            
            // 初期回転を設定（水平面に対して並行な角度で転がりやすくする）
            body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), Math.PI / 2); // Z軸周りに90度回転
            
            // 初期速度を0に設定
            body.velocity.set(0, 0, 0);
            body.angularVelocity.set(0, 0, 0);
            
            // 速度制限を設定して吹っ飛びを防ぐ
            body.addEventListener('postStep', function() {
                // 線形速度の制限
                const maxLinearVelocity = 15;
                if (body.velocity.length() > maxLinearVelocity) {
                    body.velocity.scale(maxLinearVelocity / body.velocity.length(), body.velocity);
                }
                
                // 角速度の制限
                const maxAngularVelocity = 10;
                if (body.angularVelocity.length() > maxAngularVelocity) {
                    body.angularVelocity.scale(maxAngularVelocity / body.angularVelocity.length(), body.angularVelocity);
                }
            });
            
            // モデルをピボットグループに追加
            const pivot = new THREE.Group();
            pivot.add(model);
            scene.add(pivot);
            
            // モデルの位置と回転を初期化
            pivot.position.copy(new THREE.Vector3(
                body.position.x,
                body.position.y,
                body.position.z
            ));
            
            pivot.quaternion.copy(new THREE.Quaternion(
                body.quaternion.x,
                body.quaternion.y,
                body.quaternion.z,
                body.quaternion.w
            ));
            
            // 物理世界に追加
            world.addBody(body);
            
            // 灯籠オブジェクトを返す
            return {
                model: model,
                body: body,
                pivot: pivot,
                rotationSpeed: (Math.random() * 0.75 + 0.45) * (Math.random() > 0.5 ? 1 : -1) // ランダムな回転速度（15倍速く）
            };
        }
        
        // 既存の灯籠をリセットする関数
        function resetLanterns() {
            // すべての灯籠をリセット
            for (let i = 0; i < lanterns.length; i++) {
                const lantern = lanterns[i];
                
                // 物理ボディを削除
                if (lantern.body) {
                    world.removeBody(lantern.body);
                }
                
                // シーンからピボットを削除
                if (lantern.pivot) {
                    scene.remove(lantern.pivot);
                }
                
                // 新しい灯籠を作成（モデルをクローンして使用）
                const newModel = lantern.model.clone();
                lanterns[i] = createLantern(newModel, i);
            }
        }
        
        // GLBモデルを読み込む
        function loadModels() {
            // いくつかのパスを試してみる
            const possiblePaths = [
                '_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb',
                '../_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb',
                '../docs/_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb',
                './docs/_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb',
                '/docs/_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb',
                'https://raw.githubusercontent.com/soh1106/test_cline3/main/docs/_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb'
            ];
            
            let modelPath = possiblePaths[0];
            let pathIndex = 0;
            
            function tryLoadModel() {
                console.log('モデルの読み込みを試行:', modelPath);
                
                // DRACOローダーの設定
                const dracoLoader = new THREE.DRACOLoader();
                dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
                
                // GLTFローダーの設定
                const loader = new THREE.GLTFLoader();
                loader.setDRACOLoader(dracoLoader);
            
            // モデルを読み込む
            loader.load(
                modelPath,
                function(gltf) {
                    // ローディング表示を非表示にする
                    document.getElementById('loading').style.display = 'none';
                    
                    console.log('GLBモデルを正常に読み込みました');
                    
                    // 複数の灯籠を作成
                    for (let i = 0; i < lanternCount; i++) {
                        // モデルをクローン
                        const model = gltf.scene.clone();
                        
                        // モデルのサイズを調整
                        const box = new THREE.Box3().setFromObject(model);
                        const size = box.getSize(new THREE.Vector3()).length();
                        const center = box.getCenter(new THREE.Vector3());
                        
                        // モデルを中央に配置
                        model.position.x = -center.x;
                        model.position.y = -center.y;
                        model.position.z = -center.z;
                        
                        // モデルの根本（下部）を起点にする
                        const bottomY = box.min.y;
                        model.position.y -= bottomY;
                        
                        // シャドウを有効化
                        model.traverse(function(child) {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        
                        // 灯籠オブジェクトを作成して配列に追加
                        const lantern = createLantern(model, i);
                        lanterns.push(lantern);
                    }
                },
                function(xhr) {
                    // 読み込み進捗の処理
                    console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                function(error) {
                    console.error('GLBファイルの読み込みに失敗しました:', error);
                    
                    // 次のパスを試す
                    pathIndex++;
                    if (pathIndex < possiblePaths.length) {
                        modelPath = possiblePaths[pathIndex];
                        console.log('次のパスを試行:', modelPath);
                        tryLoadModel();
                    } else {
                        // 最後の手段として、デフォルトの箱を表示
                        console.error('すべてのパスでモデルの読み込みに失敗しました。代わりに箱を表示します。');
                        createDefaultBoxes();
                        
                        // ローディング表示を非表示にする
                        document.getElementById('loading').style.display = 'none';
                    }
                }
            );
            }
            
            // 最初のパスで読み込みを開始
            tryLoadModel();
        }
        
        // デフォルトの箱を作成する関数
        function createDefaultBoxes() {
            // 複数の箱を作成
            for (let i = 0; i < lanternCount; i++) {
                // 箱のジオメトリを作成
                const geometry = new THREE.BoxGeometry(1, 2, 1);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xA0522D,
                    roughness: 0.7,
                    metalness: 0.3
                });
                
                // メッシュを作成
                const model = new THREE.Mesh(geometry, material);
                model.castShadow = true;
                model.receiveShadow = true;
                
                // 灯籠オブジェクトを作成して配列に追加
                const lantern = createLantern(model, i);
                lanterns.push(lantern);
            }
            
            console.log('デフォルトの箱を作成しました');
        }
        
        // 角度変換関数
        function toRadians(angle) {
            return angle * (Math.PI / 180);
        }
        
        function toDegrees(angle) {
            return angle * (180 / Math.PI);
        }
        
        // イベントリスナーを設定
        document.getElementById('resetSimulation').addEventListener('click', function() {
            // 灯籠が作成されている場合のみ実行
            if (lanterns.length > 0) {
                resetLanterns();
            }
        });
        
        document.getElementById('slopeAngle').addEventListener('input', function() {
            const angle = parseFloat(this.value);
            document.getElementById('slopeAngleValue').textContent = angle + '°';
            
            // 坂の角度変更時に灯籠の位置を調整
            const radians = toRadians(angle);
            
            // 既存の灯籠の位置を調整して坂を突き抜けないようにする
            for (let i = 0; i < lanterns.length; i++) {
                const lantern = lanterns[i];
                if (lantern.body && slopeMesh) {
                    const slopeBox = new THREE.Box3().setFromObject(slopeMesh);
                    const slopeCenter = slopeBox.getCenter(new THREE.Vector3());
                    
                    // 現在のZ位置での新しい坂の表面高度を計算
                    const heightAtPosition = Math.abs(lantern.body.position.z) * Math.tan(radians);
                    const newRoadSurfaceY = slopeCenter.y + heightAtPosition;
                    const minSafeY = newRoadSurfaceY + 0.5; // 坂の表面より少し上
                    
                    // 灯籠が坂を突き抜けている場合は安全な位置に移動
                    if (lantern.body.position.y < minSafeY) {
                        lantern.body.position.y = minSafeY;
                        // 速度もリセット
                        lantern.body.velocity.y = Math.max(lantern.body.velocity.y, 0);
                    }
                }
            }
            
            createSlope();
        });
        
        document.getElementById('friction').addEventListener('input', function() {
            const friction = parseFloat(this.value);
            document.getElementById('frictionValue').textContent = friction.toFixed(2);
            
            if (slopeBody) {
                slopeBody.material.friction = friction;
            }
            
            // すべての灯籠の摩擦係数を更新
            for (let i = 0; i < lanterns.length; i++) {
                if (lanterns[i].body) {
                    lanterns[i].body.material.friction = friction;
                }
            }
        });
        
        document.getElementById('showRoadSurface').addEventListener('change', function() {
            // 道路面表示の切り替え
            if (roadPlane) {
                roadPlane.visible = this.checked;
            } else if (this.checked) {
                // チェックされているが道路面が存在しない場合は坂を再作成
                createSlope();
            }
        });
        
        document.getElementById('resetCamera').addEventListener('click', function() {
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // ウィンドウのリサイズ処理
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            
            // OrbitControlsの更新
            controls.update();
            
            // 物理シミュレーションの更新
            if (isSimulationRunning && world && lanterns.length > 0) {
                // 物理世界を更新
                world.step(timeStep);
                
                // すべての灯籠の位置と回転を更新
                for (let i = 0; i < lanterns.length; i++) {
                    const lantern = lanterns[i];
                    
                    // モデルの位置と回転を更新
                    lantern.pivot.position.copy(new THREE.Vector3(
                        lantern.body.position.x,
                        lantern.body.position.y,
                        lantern.body.position.z
                    ));
                    
                    // 物理シミュレーションの回転を適用
                    lantern.pivot.quaternion.copy(new THREE.Quaternion(
                        lantern.body.quaternion.x,
                        lantern.body.quaternion.y,
                        lantern.body.quaternion.z,
                        lantern.body.quaternion.w
                    ));
                    
                    // 追加のY軸回転を適用（勢いよく転がる効果）
                    // 物理シミュレーションの速度に基づいてY軸回転速度を調整
                    const velocity = lantern.body.velocity.length();
                    const dynamicRotationSpeed = lantern.rotationSpeed + (velocity * 1.1);
                    // 回転の向きを逆にして、転がりの方向と一致させる
                    lantern.pivot.rotateY(-dynamicRotationSpeed);
                    
                    // 坂の道路表面から厳格な距離制限で転がるように調整
                    if (slopeMesh) {
                        const slopeBox = new THREE.Box3().setFromObject(slopeMesh);
                        const slopeCenter = slopeBox.getCenter(new THREE.Vector3());
                        const slopeAngle = parseFloat(document.getElementById('slopeAngle').value);
                        const radians = toRadians(slopeAngle);
                        
                        // 灯籠の実際の高さを取得
                        const lanternBox = new THREE.Box3().setFromObject(lantern.model);
                        const lanternSize = lanternBox.getSize(new THREE.Vector3());
                        const actualLanternHeight = lanternSize.y;
                        
                        // レイキャスティングで実際の坂表面高度を取得
                        const actualSlopeHeight = getSlopeHeightAtPosition(
                            lantern.body.position.x,
                            lantern.body.position.z
                        );
                        
                        // 坂モデルの中央高度を基準道路表面として使用（従来の方法）
                        const roadSurfaceY = slopeCenter.y;
                        
                        // 実際の坂表面を考慮した制限値を計算
                        const useActualSurface = Math.abs(actualSlopeHeight - roadSurfaceY) > 0.1; // 差が0.1m以上ある場合
                        const effectiveSurfaceY = useActualSurface ? actualSlopeHeight : roadSurfaceY;
                        
                        const maxAllowedY = effectiveSurfaceY + (actualLanternHeight * 2); // 灯籠の高さの2倍
                        const minAllowedY = effectiveSurfaceY; // 実際の表面が下限
                        const distanceFromRoad = lantern.body.position.y - effectiveSurfaceY;
                        
                        // デバッグ情報を更新
                        document.getElementById('lanternHeight').textContent = actualLanternHeight.toFixed(2) + 'm';
                        document.getElementById('roadSurfaceY').textContent = roadSurfaceY.toFixed(2);
                        document.getElementById('actualSlopeY').textContent = actualSlopeHeight.toFixed(2);
                        document.getElementById('lanternY').textContent = lantern.body.position.y.toFixed(2);
                        document.getElementById('heightLimit').textContent = maxAllowedY.toFixed(2);
                        document.getElementById('distanceFromRoad').textContent = distanceFromRoad.toFixed(2) + 'm';
                        
                        // Y座標が制限を超えた場合は厳格に制限する
                        if (lantern.body.position.y > maxAllowedY) {
                            lantern.body.position.y = maxAllowedY;
                            // 上向きの速度を強制的に停止
                            if (lantern.body.velocity.y > 0) {
                                lantern.body.velocity.y = 0;
                            }
                        }
                        
                        // 坂を突き抜けないように下限も厳格に設定（実際の表面を使用）
                        if (lantern.body.position.y < minAllowedY) {
                            lantern.body.position.y = minAllowedY;
                            // 下向きの速度を停止
                            if (lantern.body.velocity.y < 0) {
                                lantern.body.velocity.y = 0;
                            }
                        }
                    }
                    
                    // 灯籠が坂の範囲外に出た場合のみリセット
                    // 坂の一番下まで転がらせるため、非常に緩い条件に設定
                    const isOutOfBounds = (
                        lantern.body.position.y < -50 || // 非常に低い位置に落ちた場合
                        Math.abs(lantern.body.position.x) > 50 || // X方向に大きく外れた場合
                        lantern.body.position.z > 50 // 坂の範囲を大きく超えた場合
                    );
                    
                    if (isOutOfBounds) {
                        resetLanterns();
                        break; // リセット後はループを抜ける
                    }
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // 初期化と実行
        initPhysics();
        loadModels();
        animate();
    </script>
