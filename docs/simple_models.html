<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルモデル表示</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
        }
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            font-size: 14px;
            border-radius: 4px;
            width: 200px;
        }
        #controls label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">シンプルモデル表示 - ドラッグ: 回転 | スクロール: ズーム</div>
    <div id="loading">モデルを読み込み中...</div>
    <div id="controls">
        <h3 style="margin-top: 0;">コライダー表示</h3>
        <label>
            <input type="checkbox" id="showSlopeCollider"> 坂のコライダー（メッシュ）
        </label>
        <label>
            <input type="checkbox" id="showLanternCollider"> 灯籠のコライダー
        </label>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // シーン、カメラ、レンダラーの設定
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 空色の背景
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // OrbitControlsを追加
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 環境光と指向性ライトを追加
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        scene.add(directionalLight);
        
        // XYZ軸を表示するヘルパーを追加
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // 物理世界
        let world;
        
        // コライダーを保存する変数
        let slopeCollider = null;
        let slopePhysicsBody = null;
        let slopeColliderMesh = null;
        let lanternCollider = null;
        let lanternPhysicsBody = null;
        let lanternColliderMesh = null;
        
        // 物理世界を初期化
        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;
            world.solver.tolerance = 0.001;
            
            world.defaultContactMaterial.friction = 0.4;
            world.defaultContactMaterial.restitution = 0.1;
            world.allowSleep = true;
        }
        
        // 円柱コライダーを作成する関数
        function createCylinderCollider(model, color = 0xff00ff) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            // 円柱のパラメータを計算
            const radius = Math.max(size.x, size.z) / 2; // X,Z軸の大きい方を半径とする
            const height = size.y;
            
            // 物理ボディを作成（Cannon.jsの円柱形状）
            const cylinderShape = new CANNON.Cylinder(radius, radius, height, 8); // 8角形で近似
            const physicsBody = new CANNON.Body({ mass: 0 }); // 静的オブジェクト
            physicsBody.addShape(cylinderShape);
            physicsBody.position.set(center.x, center.y, center.z);
            
            // 視覚化用の円柱メッシュを作成
            const geometry = new THREE.CylinderGeometry(radius, radius, height, 16); // 16角形で滑らか
            const material = new THREE.MeshBasicMaterial({
                color: color,
                wireframe: true,
                transparent: true,
                opacity: 0.7
            });
            
            const colliderMesh = new THREE.Mesh(geometry, material);
            colliderMesh.position.copy(center);
            colliderMesh.visible = false; // 初期状態では非表示
            
            console.log(`円柱コライダー作成:`, {
                radius: radius,
                height: height,
                center: center
            });
            
            return {
                physicsBody: physicsBody,
                visualMesh: colliderMesh
            };
        }
        
        // メッシュから物理コライダーを作成する関数
        function createMeshCollider(model) {
            const physicsBody = new CANNON.Body({ mass: 0 }); // 静的オブジェクト
            const colliderMeshes = [];
            
            model.traverse(function(child) {
                if (child.isMesh && child.geometry) {
                    try {
                        // 頂点データを取得
                        const vertices = child.geometry.attributes.position.array;
                        const indices = child.geometry.index ? child.geometry.index.array : null;
                        
                        // Cannon.jsのTrimesh形状を作成
                        const cannonVertices = [];
                        const cannonFaces = [];
                        
                        // 頂点をCannon.js形式に変換
                        for (let i = 0; i < vertices.length; i += 3) {
                            cannonVertices.push(new CANNON.Vec3(vertices[i], vertices[i + 1], vertices[i + 2]));
                        }
                        
                        // インデックスをCannon.js形式に変換
                        if (indices) {
                            for (let i = 0; i < indices.length; i += 3) {
                                cannonFaces.push([indices[i], indices[i + 1], indices[i + 2]]);
                            }
                        } else {
                            // インデックスがない場合は順番に三角形を作成
                            for (let i = 0; i < cannonVertices.length; i += 3) {
                                cannonFaces.push([i, i + 1, i + 2]);
                            }
                        }
                        
                        // Trimesh形状を作成
                        const trimeshShape = new CANNON.Trimesh(cannonVertices, cannonFaces);
                        
                        // メッシュのワールド変換を適用
                        const position = new CANNON.Vec3();
                        const quaternion = new CANNON.Quaternion();
                        
                        child.updateWorldMatrix(true, false);
                        const worldMatrix = child.matrixWorld;
                        
                        // 位置を抽出
                        position.set(worldMatrix.elements[12], worldMatrix.elements[13], worldMatrix.elements[14]);
                        
                        // 物理ボディに形状を追加
                        physicsBody.addShape(trimeshShape, position, quaternion);
                        
                        // 視覚化用のメッシュを作成（元のメッシュと完全に同じ変換を適用）
                        const visualGeometry = child.geometry.clone();
                        const visualMaterial = new THREE.MeshBasicMaterial({
                            color: 0x00ff00,
                            wireframe: true,
                            transparent: true,
                            opacity: 0.7
                        });
                        
                        const visualMesh = new THREE.Mesh(visualGeometry, visualMaterial);
                        
                        // 元のメッシュのワールド変換を完全にコピー
                        visualMesh.matrix.copy(child.matrixWorld);
                        visualMesh.matrixAutoUpdate = false;
                        
                        colliderMeshes.push(visualMesh);
                        
                        console.log(`メッシュコライダー作成: ${child.name || 'unnamed'}`, {
                            vertices: cannonVertices.length,
                            faces: cannonFaces.length,
                            worldMatrix: child.matrixWorld.elements
                        });
                        
                    } catch (error) {
                        console.warn('メッシュコライダー作成エラー:', error, child);
                    }
                }
            });
            
            // 視覚化用のグループを作成
            const colliderGroup = new THREE.Group();
            colliderMeshes.forEach(mesh => colliderGroup.add(mesh));
            colliderGroup.visible = false; // 初期状態では非表示
            
            console.log(`作成されたメッシュコライダー数: ${colliderMeshes.length}`);
            
            return {
                physicsBody: physicsBody,
                visualMesh: colliderGroup
            };
        }
        
        // GLTFローダーの設定
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
        
        const loader = new THREE.GLTFLoader();
        loader.setDRACOLoader(dracoLoader);
        
        let modelsLoaded = 0;
        const totalModels = 2;
        
        function checkAllModelsLoaded() {
            modelsLoaded++;
            if (modelsLoaded >= totalModels) {
                document.getElementById('loading').style.display = 'none';
                console.log('すべてのモデルの読み込みが完了しました');
            }
        }
        
        // 坂モデル（miura_slope.glb）を読み込み
        loader.load(
            '_model/miura_slope.glb',
            function(gltf) {
                console.log('坂モデルを読み込みました');
                const slopeModel = gltf.scene;
                
                // モデルの位置を設定
                slopeModel.position.set(0, 0, 0);
                
                // シャドウを有効化
                slopeModel.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(slopeModel);
                
                // メッシュから物理コライダーを作成
                const colliderResult = createMeshCollider(slopeModel);
                slopePhysicsBody = colliderResult.physicsBody;
                slopeColliderMesh = colliderResult.visualMesh;
                
                // 物理世界に追加
                world.addBody(slopePhysicsBody);
                
                // 視覚化メッシュをシーンに追加
                scene.add(slopeColliderMesh);
                
                slopeCollider = slopeColliderMesh; // 表示制御用
                
                // モデルのサイズと位置を確認
                const box = new THREE.Box3().setFromObject(slopeModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                console.log('坂モデル情報:');
                console.log('  サイズ:', size);
                console.log('  中心:', center);
                console.log('  バウンディングボックス:', box);
                console.log('  コライダー位置:', slopeCollider.position);
                
                checkAllModelsLoaded();
            },
            function(xhr) {
                console.log('坂モデル読み込み進捗:', (xhr.loaded / xhr.total * 100) + '%');
            },
            function(error) {
                console.error('坂モデルの読み込みに失敗しました:', error);
                checkAllModelsLoaded();
            }
        );
        
        // 灯籠モデル（Zen_Lantern_in_Garden_0426020614_texture.glb）を読み込み
        loader.load(
            '_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb',
            function(gltf) {
                console.log('灯籠モデルを読み込みました');
                const lanternModel = gltf.scene;
                
                // モデルの位置を設定（坂の上に配置）
                lanternModel.position.set(0, 3, -5);
                
                // シャドウを有効化
                lanternModel.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(lanternModel);
                
                // 円柱コライダーを作成
                const colliderResult = createCylinderCollider(lanternModel, 0xff00ff); // マゼンタ色
                lanternPhysicsBody = colliderResult.physicsBody;
                lanternColliderMesh = colliderResult.visualMesh;
                
                // 物理世界に追加
                world.addBody(lanternPhysicsBody);
                
                // 視覚化メッシュをシーンに追加
                scene.add(lanternColliderMesh);
                
                lanternCollider = lanternColliderMesh; // 表示制御用
                
                // モデルのサイズと位置を確認
                const box = new THREE.Box3().setFromObject(lanternModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                console.log('灯籠モデル情報:');
                console.log('  サイズ:', size);
                console.log('  中心:', center);
                console.log('  バウンディングボックス:', box);
                console.log('  配置位置:', lanternModel.position);
                console.log('  コライダー位置:', lanternCollider.position);
                
                checkAllModelsLoaded();
            },
            function(xhr) {
                console.log('灯籠モデル読み込み進捗:', (xhr.loaded / xhr.total * 100) + '%');
            },
            function(error) {
                console.error('灯籠モデルの読み込みに失敗しました:', error);
                checkAllModelsLoaded();
            }
        );
        
        // チェックボックスのイベントリスナーを設定
        document.getElementById('showSlopeCollider').addEventListener('change', function() {
            if (slopeCollider) {
                slopeCollider.visible = this.checked;
                console.log('坂のコライダー（メッシュ）表示:', this.checked ? 'オン' : 'オフ');
            }
        });
        
        document.getElementById('showLanternCollider').addEventListener('change', function() {
            if (lanternCollider) {
                lanternCollider.visible = this.checked;
                console.log('灯籠のコライダー表示:', this.checked ? 'オン' : 'オフ');
            }
        });
        
        // ウィンドウのリサイズ処理
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            
            // OrbitControlsの更新
            controls.update();
            
            renderer.render(scene, camera);
        }
        
        // 物理世界を初期化
        initPhysics();
        
        // アニメーション開始
        animate();
    </script>
</body>
</html>
