<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルモデル表示</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
        }
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            font-size: 14px;
            border-radius: 4px;
            width: 200px;
        }
        #controls label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">シンプルモデル表示 - ドラッグ: 回転 | スクロール: ズーム | スペースキー: 灯籠追加</div>
    <div id="loading">モデルを読み込み中...</div>
    <div id="controls">
        <h3 style="margin-top: 0;">表示制御</h3>
        <label>
            <input type="checkbox" id="showSlopeMesh" checked> 坂のメッシュ
        </label>
        <label>
            <input type="checkbox" id="slopeMeshWireframe"> 坂のワイヤーフレーム
        </label>
        <label>
            <input type="checkbox" id="showSlopeCollider"> 坂のコライダー
        </label>
        <label>
            <input type="checkbox" id="showLanternCollider"> 灯籠のコライダー
        </label>
    </div>
    <div id="debugConsole" style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; font-size: 12px; border-radius: 4px; width: 300px; height: 200px; overflow-y: auto; font-family: monospace;">
        <div style="font-weight: bold; margin-bottom: 5px;">デバッグコンソール</div>
        <div id="debugOutput"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // シーン、カメラ、レンダラーの設定
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 空色の背景
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // OrbitControlsを追加
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 環境光と指向性ライトを追加
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        scene.add(directionalLight);
        
        // XYZ軸を表示するヘルパーを追加
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // 物理世界
        let world;
        
        // コライダーとメッシュを保存する変数
        let slopeMesh = null;
        let slopeCollider = null;
        let slopePhysicsBody = null;
        let slopeColliderMesh = null;
        let lanternCollider = null;
        let lanternPhysicsBody = null;
        let lanternColliderMesh = null;
        
        // 元のマテリアルを保存するためのマップ
        const originalMaterials = new Map();
        
        // 複数の灯籠を管理するための配列
        let lanterns = [];
        let lanternTemplate = null; // 灯籠のテンプレートモデル
        let lanternCounter = 0; // 灯籠のID管理用
        
        // デバッグ出力関数
        function debugLog(message) {
            const debugOutput = document.getElementById('debugOutput');
            const timestamp = new Date().toLocaleTimeString();
            debugOutput.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            debugOutput.scrollTop = debugOutput.scrollHeight;
            
            // 最大100行まで保持
            const lines = debugOutput.children;
            if (lines.length > 100) {
                debugOutput.removeChild(lines[0]);
            }
        }
        
        // 物理世界を初期化
        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.solver.iterations = 20; // より多くの反復で安定性向上
            world.solver.tolerance = 0.0001; // より厳密な許容値
            
            world.defaultContactMaterial.friction = 0.4;
            world.defaultContactMaterial.restitution = 0.1;
            world.allowSleep = true;
            
            // 連続衝突検出を有効化してすり抜けを防ぐ
            world.defaultContactMaterial.contactEquationStiffness = 1e8;
            world.defaultContactMaterial.contactEquationRelaxation = 3;
            world.defaultContactMaterial.frictionEquationStiffness = 1e8;
            world.defaultContactMaterial.frictionEquationRelaxation = 3;
            
            // 物理世界レベルでの接触イベントリスナー
            world.addEventListener('beginContact', function(event) {
                debugLog(`物理世界: 接触開始 (${event.bodyA.id} - ${event.bodyB.id})`);
            });
            
            world.addEventListener('endContact', function(event) {
                debugLog(`物理世界: 接触終了 (${event.bodyA.id} - ${event.bodyB.id})`);
            });
        }
        
        // 新しい灯籠を作成する関数
        function createNewLantern() {
            if (!lanternTemplate) {
                debugLog('灯籠テンプレートが読み込まれていません');
                return;
            }
            
            const lanternId = ++lanternCounter;
            
            // 灯籠モデルをクローン
            const lanternModel = lanternTemplate.clone();
            
            // ランダムな位置に配置（X軸方向に少しずらす）
            const startX = (Math.random() - 0.5) * 4; // -2から2の範囲
            const startY = 50; // 坂より十分高い位置
            const startZ = -10; // 坂の上部より後方
            
            lanternModel.position.set(startX, startY, startZ);
            lanternModel.rotation.z = Math.PI / 2; // Z軸周りに90度回転（横倒し）
            
            // シャドウを有効化
            lanternModel.traverse(function(child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            scene.add(lanternModel);
            
            // 物理ボディを作成
            const colliderResult = createRollingCylinderCollider(lanternModel, 0xff00ff, startX, startY, startZ);
            const physicsBody = colliderResult.physicsBody;
            const colliderMesh = colliderResult.visualMesh;
            
            // 物理世界に追加
            world.addBody(physicsBody);
            scene.add(colliderMesh);
            
            // 灯籠オブジェクトを配列に追加
            const lantern = {
                id: lanternId,
                model: lanternModel,
                physicsBody: physicsBody,
                colliderMesh: colliderMesh,
                createdTime: Date.now()
            };
            
            lanterns.push(lantern);
            
            debugLog(`新しい灯籠を作成しました ID: ${lanternId} 位置: (${startX.toFixed(1)}, ${startY}, ${startZ})`);
            
            return lantern;
        }
        
        // 灯籠を削除する関数
        function removeLantern(lantern) {
            // シーンから削除
            scene.remove(lantern.model);
            scene.remove(lantern.colliderMesh);
            
            // 物理世界から削除
            world.removeBody(lantern.physicsBody);
            
            // 配列から削除
            const index = lanterns.indexOf(lantern);
            if (index > -1) {
                lanterns.splice(index, 1);
            }
            
            debugLog(`灯籠を削除しました ID: ${lantern.id}`);
        }
        
        // 円柱コライダーを作成する関数（転がる灯籠用）
        function createRollingCylinderCollider(model, color = 0xff00ff, startX = 0, startY = 50, startZ = -10) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            // 円柱のパラメータを計算（横倒し用）
            const radius = size.y / 2; // Y軸（高さ）を半径とする
            const height = Math.max(size.x, size.z); // X,Z軸の大きい方を円柱の高さとする
            
            // 物理ボディを作成（動的オブジェクト）
            const cylinderShape = new CANNON.Cylinder(radius, radius, height, 8); // 8角形で近似
            const physicsBody = new CANNON.Body({ mass: 50 }); // 動的オブジェクト
            physicsBody.addShape(cylinderShape);
            
            // 指定された位置に配置
            physicsBody.position.set(startX, startY, startZ);
            
            // 横倒しの回転（Z軸周りに90度回転）
            physicsBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), Math.PI / 2);
            
            // 物理マテリアルを設定
            physicsBody.material = new CANNON.Material();
            physicsBody.material.friction = 0.3;
            physicsBody.material.restitution = 0.1;
            
            // 減衰設定
            physicsBody.linearDamping = 0.1;
            physicsBody.angularDamping = 0.1;
            
            // 連続衝突検出を有効化してすり抜けを防ぐ
            physicsBody.ccdSpeedThreshold = 1;
            physicsBody.ccdIterations = 10;
            
            // 接触イベントリスナーを追加
            physicsBody.addEventListener('collide', function(event) {
                const otherBody = event.target === physicsBody ? event.contact.bj : event.contact.bi;
                debugLog(`灯籠が接触しました！ 相手: ${otherBody === slopePhysicsBody ? '坂' : '不明'}`);
            });
            
            // 視覚化用の円柱メッシュを作成
            const geometry = new THREE.CylinderGeometry(radius, radius, height, 16); // 16角形で滑らか
            const material = new THREE.MeshBasicMaterial({
                color: color,
                wireframe: true,
                transparent: true,
                opacity: 0.7
            });
            
            const colliderMesh = new THREE.Mesh(geometry, material);
            colliderMesh.position.set(startX, startY, startZ);
            colliderMesh.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2); // 横倒し
            colliderMesh.visible = false; // 初期状態では非表示
            
            return {
                physicsBody: physicsBody,
                visualMesh: colliderMesh
            };
        }
        
        // 坂の薄いBoxコライダーを作成する関数（Y軸方向を薄く）
        function createMeshCollider(model) {
            // モデル全体のバウンディングボックスを取得
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            debugLog(`坂モデルサイズ: X=${size.x.toFixed(2)}, Y=${size.y.toFixed(2)}, Z=${size.z.toFixed(2)}`);
            debugLog(`坂モデル中心: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`);
            
            // Y軸方向を非常に薄くしたBoxコライダーを作成
            const thinY = 0.1; // Y軸方向を0.1の厚さに設定
            const boxHalfExtents = new CANNON.Vec3(size.x/2, thinY/2, size.z/2);
            
            // 物理ボディを作成
            const physicsBody = new CANNON.Body({ mass: 0 });
            const boxShape = new CANNON.Box(boxHalfExtents);
            physicsBody.addShape(boxShape);
            
            // 中心位置に配置（Y座標を37上げて坂のメッシュとほぼ同じ高さに）
            physicsBody.position.set(center.x, center.y - size.y/2 + thinY/2 + 37, center.z);
            
            // X軸で35°回転させる
            const rotationAngle = 35 * Math.PI / 180; // 35度をラジアンに変換
            physicsBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), rotationAngle);
            
            // 物理マテリアルを設定
            physicsBody.material = new CANNON.Material();
            physicsBody.material.friction = 0.4;
            physicsBody.material.restitution = 0.1;
            
            // 視覚化用のBoxメッシュを作成
            const visualGeometry = new THREE.BoxGeometry(size.x, thinY, size.z);
            const visualMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ff00,
                wireframe: true,
                transparent: true,
                opacity: 0.6
            });
            
            const visualMesh = new THREE.Mesh(visualGeometry, visualMaterial);
            visualMesh.position.set(center.x, center.y - size.y/2 + thinY/2 + 37, center.z);
            
            // 視覚化メッシュも同じ角度で回転
            visualMesh.rotation.x = rotationAngle;
            visualMesh.visible = false; // 初期状態では非表示
            
            debugLog(`坂薄型Boxコライダー作成完了 (X軸35°回転)`);
            debugLog(`コライダーサイズ: X=${size.x.toFixed(2)}, Y=${thinY.toFixed(2)}, Z=${size.z.toFixed(2)}`);
            debugLog(`コライダー位置: (${physicsBody.position.x.toFixed(2)}, ${physicsBody.position.y.toFixed(2)}, ${physicsBody.position.z.toFixed(2)})`);
            debugLog(`コライダー回転: X軸35°`);
            
            return {
                physicsBody: physicsBody,
                visualMesh: visualMesh
            };
        }
        
        // GLTFローダーの設定
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
        
        const loader = new THREE.GLTFLoader();
        loader.setDRACOLoader(dracoLoader);
        
        let modelsLoaded = 0;
        const totalModels = 2;
        
        function checkAllModelsLoaded() {
            modelsLoaded++;
            if (modelsLoaded >= totalModels) {
                document.getElementById('loading').style.display = 'none';
                console.log('すべてのモデルの読み込みが完了しました');
            }
        }
        
        // 坂モデル（miura_slope.glb）を読み込み
        loader.load(
            '_model/miura_slope.glb',
            function(gltf) {
                console.log('坂モデルを読み込みました');
                const slopeModel = gltf.scene;
                
                // モデルの位置を設定
                slopeModel.position.set(0, 0, 0);
                
                // X軸で35°回転させる
                const rotationAngle = 35 * Math.PI / 180; // 35度をラジアンに変換
                slopeModel.rotation.x = rotationAngle;
                
                // ワイヤーフレーム用の色分けデータを準備する関数
                function prepareWireframeColors(mesh) {
                    const geometry = mesh.geometry;
                    if (!geometry.attributes.normal) {
                        geometry.computeVertexNormals();
                    }
                    
                    const normals = geometry.attributes.normal;
                    const colors = [];
                    
                    // 各頂点の法線ベクトルを確認して色を決定
                    for (let i = 0; i < normals.count; i++) {
                        const normal = new THREE.Vector3(
                            normals.getX(i),
                            normals.getY(i),
                            normals.getZ(i)
                        );
                        
                        // 法線と垂直ベクトル(0,1,0)との角度を計算
                        const verticalVector = new THREE.Vector3(0, 1, 0);
                        const angle = Math.acos(Math.abs(normal.dot(verticalVector))) * 180 / Math.PI;
                        
                        // 45°以上の角度を垂直面（壁）として赤色
                        // 45°未満を水平面（道路）として青色
                        if (angle >= 45) {
                            // 垂直面（壁）- 赤色
                            colors.push(1.0, 0.2, 0.2); // 赤
                        } else {
                            // 水平面（道路）- 青色
                            colors.push(0.2, 0.4, 1.0); // 青
                        }
                    }
                    
                    // ワイヤーフレーム用の色データを保存
                    geometry.setAttribute('wireframeColor', new THREE.Float32BufferAttribute(colors, 3));
                }
                
                // シャドウを有効化
                slopeModel.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        
                        // 元のマテリアルを保存
                        originalMaterials.set(child, child.material.clone());
                        
                        // ワイヤーフレーム用の色データを準備
                        prepareWireframeColors(child);
                    }
                });
                
                scene.add(slopeModel);
                
                // 坂のメッシュを変数に保存
                slopeMesh = slopeModel;
                
                // メッシュと同等のTrimeshコライダーを作成
                const colliderResult = createMeshCollider(slopeModel);
                slopePhysicsBody = colliderResult.physicsBody;
                slopeColliderMesh = colliderResult.visualMesh;
                
                // 物理世界に追加
                world.addBody(slopePhysicsBody);
                
                // 視覚化メッシュをシーンに追加
                scene.add(slopeColliderMesh);
                
                slopeCollider = slopeColliderMesh; // 表示制御用
                
                // 坂の物理ボディ情報をデバッグ出力
                debugLog(`坂の物理ボディ作成完了 ID: ${slopePhysicsBody.id}`);
                debugLog(`坂の物理ボディ位置: (${slopePhysicsBody.position.x.toFixed(2)}, ${slopePhysicsBody.position.y.toFixed(2)}, ${slopePhysicsBody.position.z.toFixed(2)})`);
                debugLog(`坂の形状数: ${slopePhysicsBody.shapes.length}`);
                debugLog(`坂の質量: ${slopePhysicsBody.mass}`);
                
                // モデルのサイズと位置を確認
                const box = new THREE.Box3().setFromObject(slopeModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                console.log('坂モデル情報:');
                console.log('  サイズ:', size);
                console.log('  中心:', center);
                console.log('  バウンディングボックス:', box);
                console.log('  コライダー位置:', slopeCollider.position);
                
                checkAllModelsLoaded();
            },
            function(xhr) {
                console.log('坂モデル読み込み進捗:', (xhr.loaded / xhr.total * 100) + '%');
            },
            function(error) {
                console.error('坂モデルの読み込みに失敗しました:', error);
                checkAllModelsLoaded();
            }
        );
        
        // 灯籠モデル（Zen_Lantern_in_Garden_0426020614_texture.glb）を読み込み
        loader.load(
            '_model/Zen_Lantern_in_Garden_0425152153_texture_fbx/Zen_Lantern_in_Garden_0426020614_texture.glb',
            function(gltf) {
                console.log('灯籠モデルを読み込みました');
                
                // テンプレートとして保存
                lanternTemplate = gltf.scene;
                
                // 最初の灯籠を作成
                const firstLantern = createNewLantern();
                
                // 後方互換性のために古い変数も設定
                lanternPhysicsBody = firstLantern.physicsBody;
                lanternColliderMesh = firstLantern.colliderMesh;
                lanternCollider = firstLantern.colliderMesh;
                
                // 灯籠の物理ボディ情報をデバッグ出力
                debugLog(`最初の灯籠の物理ボディ作成完了 ID: ${firstLantern.physicsBody.id}`);
                
                checkAllModelsLoaded();
            },
            function(xhr) {
                console.log('灯籠モデル読み込み進捗:', (xhr.loaded / xhr.total * 100) + '%');
            },
            function(error) {
                console.error('灯籠モデルの読み込みに失敗しました:', error);
                checkAllModelsLoaded();
            }
        );
        
        // チェックボックスのイベントリスナーを設定
        document.getElementById('showSlopeMesh').addEventListener('change', function() {
            if (slopeMesh) {
                slopeMesh.visible = this.checked;
                console.log('坂のメッシュ表示:', this.checked ? 'オン' : 'オフ');
            }
        });
        
        document.getElementById('slopeMeshWireframe').addEventListener('change', function() {
            if (slopeMesh) {
                slopeMesh.traverse(function(child) {
                    if (child.isMesh && child.material) {
                        if (this.checked) {
                            // ワイヤーフレーム表示時：道路と壁で色分け
                            const geometry = child.geometry;
                            if (geometry.attributes.wireframeColor) {
                                // 色分けされたワイヤーフレーム用マテリアルを作成
                                const wireframeMaterial = new THREE.MeshBasicMaterial({
                                    vertexColors: true,
                                    wireframe: true
                                });
                                
                                // 色属性をwireframeColorから通常のcolorに設定
                                geometry.setAttribute('color', geometry.attributes.wireframeColor);
                                child.material = wireframeMaterial;
                            }
                        } else {
                            // 通常表示時：元のマテリアルを復元
                            if (originalMaterials.has(child)) {
                                child.material = originalMaterials.get(child).clone();
                            }
                            
                            // 色属性を削除
                            if (child.geometry.attributes.color) {
                                child.geometry.deleteAttribute('color');
                            }
                        }
                    }
                }.bind(this));
                console.log('坂のワイヤーフレーム表示:', this.checked ? 'オン' : 'オフ');
            }
        });
        
        document.getElementById('showSlopeCollider').addEventListener('change', function() {
            if (slopeCollider) {
                slopeCollider.visible = this.checked;
                console.log('坂のコライダー表示:', this.checked ? 'オン' : 'オフ');
            }
        });
        
        document.getElementById('showLanternCollider').addEventListener('change', function() {
            // 全ての灯籠のコライダー表示を切り替え
            lanterns.forEach(function(lantern) {
                lantern.colliderMesh.visible = this.checked;
            }.bind(this));
            console.log('灯籠のコライダー表示:', this.checked ? 'オン' : 'オフ');
        });
        
        // キーボードイベントハンドラー（スペースキーで灯籠を追加）
        document.addEventListener('keydown', function(event) {
            // スペースキーが押された場合
            if (event.code === 'Space') {
                event.preventDefault(); // ページのスクロールを防ぐ
                createNewLantern();
            }
        });
        
        // ダブルクリックイベントハンドラー（灯籠を追加）
        renderer.domElement.addEventListener('dblclick', function(event) {
            event.preventDefault();
            createNewLantern();
        });
        
        // ウィンドウのリサイズ処理
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            
            // OrbitControlsの更新
            controls.update();
            
            // 物理シミュレーションの更新（より小さなタイムステップで精度向上）
            if (world) {
                world.step(1/120); // より小さなタイムステップでトンネリングを防ぐ
                
                // 全ての灯籠の位置と回転を物理ボディに同期
                const lanternsToRemove = [];
                
                lanterns.forEach(function(lantern) {
                    const physicsBody = lantern.physicsBody;
                    const colliderMesh = lantern.colliderMesh;
                    const model = lantern.model;
                    
                    // 灯籠が坂を下り終わったかチェック（Y座標が-50以下、またはZ座標が50以上）
                    if (physicsBody.position.y < -50 || physicsBody.position.z > 50) {
                        lanternsToRemove.push(lantern);
                        return;
                    }
                    
                    // コライダーメッシュの位置と回転を更新
                    colliderMesh.position.copy(new THREE.Vector3(
                        physicsBody.position.x,
                        physicsBody.position.y,
                        physicsBody.position.z
                    ));
                    
                    colliderMesh.quaternion.copy(new THREE.Quaternion(
                        physicsBody.quaternion.x,
                        physicsBody.quaternion.y,
                        physicsBody.quaternion.z,
                        physicsBody.quaternion.w
                    ));
                    
                    // 灯籠モデルの位置と回転も同期
                    model.position.copy(new THREE.Vector3(
                        physicsBody.position.x,
                        physicsBody.position.y,
                        physicsBody.position.z
                    ));
                    
                    model.quaternion.copy(new THREE.Quaternion(
                        physicsBody.quaternion.x,
                        physicsBody.quaternion.y,
                        physicsBody.quaternion.z,
                        physicsBody.quaternion.w
                    ));
                });
                
                // 坂を下り終わった灯籠を削除
                lanternsToRemove.forEach(function(lantern) {
                    removeLantern(lantern);
                });
                
                // デバッグ情報を表示（5秒ごと）
                if (Math.floor(Date.now() / 5000) !== Math.floor((Date.now() - 16) / 5000)) {
                    debugLog(`現在の灯籠数: ${lanterns.length}`);
                    if (lanterns.length > 0) {
                        const firstLantern = lanterns[0];
                        const pos = firstLantern.physicsBody.position;
                        const vel = firstLantern.physicsBody.velocity.length();
                        debugLog(`最初の灯籠位置: (${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}) 速度: ${vel.toFixed(2)}`);
                    }
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // 物理世界を初期化
        initPhysics();
        
        // アニメーション開始
        animate();
    </script>
</body>
</html>
